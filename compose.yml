name: geoapp

services:
  db:
    image: postgres:17

    environment:
      POSTGRES_DB: geoapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - geoapp_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geoapp"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  geoapp_data:
  