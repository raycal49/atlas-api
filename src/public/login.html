<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raymond Calderon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <script src="/js/login.js" type="module"></script>
    <title>Phone Co</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="/index.html">Phone Co</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navLinks">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/plans.html">Plans</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 py-5">
        <!-- the grid caps how wide the card gets, which is what the old
             .form-card rule was doing by hand -->
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form id="userinfo" action="/auth/login" method="POST">
                            <h1 class="h3 mb-1 text-center">Welcome</h1>
                            <p class="text-body-secondary text-center mb-4">Sign into your account.</p>

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username"
                                       placeholder="Enter username" autocomplete="username" required />
                                <span class="invisible text-danger small" id="username-error" aria-live="polite">Username is required</span>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Enter password" autocomplete="current-password" required />
                                <span class="invisible text-danger small" id="password-error" aria-live="polite">Password is required</span>
                            </div>

                            <!-- form-level errors (wrong credentials, server trouble) -- text is filled in by login.js -->
                            <span class="invisible text-danger small d-block mb-2" id="form-error" aria-live="polite"></span>

                            <p class="small">Don't have an account?
                                <a href="/register.html">Register here</a>
                            </p>

                            <button id="submit-button" type="submit" class="btn btn-primary w-100">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-body-tertiary border-top py-3">
        <div class="container text-center text-body-secondary small">
            <p class="mb-0">Phone Co &mdash; a learning project, not a real service.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
