<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raymond Calderon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <script src="/js/register.js" type="module"></script>
    <title>Phone Co</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="/index.html">Phone Co</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navLinks">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/plans.html">Plans</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form id="userinfo" action="/auth/register" method="POST">
                            <h1 class="h3 mb-4 text-center">Make a new account</h1>

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username"
                                       placeholder="Enter your username" minlength="5" maxlength="15" required />
                                <span class="invisible text-danger small" id="username-error">Use 5-15 letters or numbers.</span>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="you@company.com" required />
                                <span class="invisible text-danger small" id="email-error">Invalid email</span>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Enter your password" minlength="5" maxlength="12" required />
                                <span class="invisible text-danger small" id="password-error">Min 8 characters, 1 uppercase, 1 number.</span>
                            </div>

                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">Confirm password</label>
                                <input type="password" class="form-control" id="confirm_password"
                                    placeholder="Re-enter your password" required />
                                <span class="invisible text-danger small" id="confirm_password-error">Passwords do not match</span>
                            </div>

                            <!-- form-level errors (username taken, server trouble) -- text is filled in by register.js -->
                            <span class="invisible text-danger small d-block mb-2" id="form-error" aria-live="polite"></span>

                            <p class="small">Already have an account?
                                <a href="/login.html">Login here</a>
                            </p>

                            <button id="submit-button" type="submit" class="btn btn-primary w-100">Register</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-body-tertiary border-top py-3">
        <div class="container text-center text-body-secondary small">
            <p class="mb-0">Phone Co &mdash; a learning project, not a real service.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
