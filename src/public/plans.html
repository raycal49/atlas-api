<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raymond Calderon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.css">

    <script>
        document.documentElement.classList.add(
            /(^|;\s*)signed_in=1(;|$)/.test(document.cookie) ? "auth-in" : "auth-out"
        );
    </script>
    <script src="/js/plans.js" type="module"></script>
    <title>Atlas API</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="/index.html">Atlas API</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navLinks">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/plans.html">Plans</a></li>

                        <li class="nav-item" data-auth="in"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                        <li class="nav-item" data-auth="in">
                            <form method="POST" action="/auth/logout">
                                <button type="submit" class="nav-link border-0 bg-transparent">Log out</button>
                            </form>
                        </li>

                        <li class="nav-item" data-auth="out"><a class="nav-link" href="/login.html">Login</a></li>
                        <li class="nav-item" data-auth="out"><a class="nav-link" href="/register.html">Register</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 py-5">
        <div class="text-center mb-4">
            <h1 class="h2">Pick a plan</h1>
            <p class="text-body-secondary">Choose the plan that fits you.</p>
        </div>

        <div id="planList" class="row row-cols-1 row-cols-md-3 g-4 justify-content-center"></div>

        <div class="row justify-content-center mt-4">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <form id="paymentForm" class="card shadow-sm d-none" data-auth="in">
                    <div class="card-body p-4">
                        <h2 class="h4 mb-3">Subscribe to <span id="chosenPlanName"></span></h2>
                        <p class="text-body-secondary mb-1">Due today: <span id="dueToday"></span></p>
                        <p class="small text-body-secondary mb-3 d-none" id="effectiveNote"></p>

                        <div class="mb-3" id="cardField">
                            <label for="card_number" class="form-label">Card number</label>
                            <input type="text" class="form-control" id="card_number" name="card_number"
                                   placeholder="Enter card number" inputmode="numeric" minlength="13" maxlength="19" required />
                            <span class="invisible text-danger small" id="card_number-error" aria-live="polite">Card number must be 13-19 digits</span>
                        </div>

                        <span class="invisible text-danger small d-block mb-2" id="form-error" aria-live="polite"></span>
                        <span class="invisible text-success small d-block mb-2" id="form-notice" aria-live="polite"></span>

                        <button id="submit-button" type="submit" class="btn btn-primary w-100">Pay</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-body-tertiary border-top py-3">
        <div class="container text-center text-body-secondary small">
            <p class="mb-0">Atlas API</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
