<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raymond Calderon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <script>
        document.documentElement.classList.add(
            /(^|;\s*)signed_in=1(;|$)/.test(document.cookie) ? "auth-in" : "auth-out"
        );
    </script>
    <script src="/js/dashboard.js" type="module"></script>
    <title>Atlas API</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="/index.html">Atlas API</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navLinks">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/plans.html">Plans</a></li>

                        <li class="nav-item" data-auth="in"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
                        <li class="nav-item" data-auth="in">
                            <form method="POST" action="/auth/logout">
                                <button type="submit" class="nav-link border-0 bg-transparent">Log out</button>
                            </form>
                        </li>

                        <li class="nav-item" data-auth="out"><a class="nav-link" href="/login.html">Login</a></li>
                        <li class="nav-item" data-auth="out"><a class="nav-link" href="/register.html">Register</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <section class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3">Dashboard</h1>
                        <p class="text-body-secondary">Welcome back.</p>

                        <div id="paidBanner" class="alert alert-success d-none" role="alert">
                            Payment received &mdash; receipt #<span id="receiptId"></span>
                        </div>

                        <div id="myPlanSection" class="placeholder-glow">
                            <div class="row row-cols-1 row-cols-sm-3 g-3 mb-3">
                                <div class="col">
                                    <div class="card h-100">
                                        <div class="card-body">
                                            <p class="text-uppercase small fw-semibold text-body-secondary mb-1">Plan</p>
                                            <p class="fs-4 fw-semibold lh-1 mb-1" id="planName"><span class="placeholder col-7"></span></p>
                                            <p class="small text-body-secondary mb-0" id="planPrice"><span class="placeholder col-5"></span></p>
                                            <a href="/plans.html" class="stretched-link" aria-label="Change plan"></a>
                                        </div>
                                    </div>
                                </div>

                                <div class="col">
                                    <div class="card h-100">
                                        <div class="card-body">
                                            <p class="text-uppercase small fw-semibold text-body-secondary mb-1">Next bill</p>
                                            <p class="fs-4 fw-semibold lh-1 mb-1" id="nextBillDue"><span class="placeholder col-6"></span></p>
                                            <p class="small text-body-secondary mb-0" id="nextBillIn"><span class="placeholder col-4"></span></p>
                                            <a href="/payments" class="stretched-link" aria-label="View billing history"></a>
                                        </div>
                                    </div>
                                </div>

                                <div class="col">
                                    <div class="card h-100">
                                        <div class="card-body">
                                            <p class="text-uppercase small fw-semibold text-body-secondary mb-1">Calls this period</p>
                                            <p class="fs-4 fw-semibold lh-1 mb-1" id="totalCalls"><span class="placeholder col-5"></span></p>
                                            <p class="small text-body-secondary mb-0" id="apiCount"><span class="placeholder col-6"></span></p>
                                            <a href="/usage" class="stretched-link" aria-label="View the full call log"></a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <p class="text-body-secondary small mb-0">Member since <span id="planSince"><span class="placeholder col-1"></span></span></p>
                        </div>

                        <div id="pickPlanPrompt" class="d-none">
                            <h2 class="h5">No plan yet</h2>
                            <p>You don't have a plan. Pick one to get started!</p>
                            <p><a href="/plans.html">Pick a plan</a></p>
                        </div>

                        <div id="usageSection" class="placeholder-glow">
                            <hr>
                            <h2 class="h5 mb-0">API Usage</h2>
                            <p class="small text-body-secondary" id="usagePeriod"><span class="placeholder col-3"></span></p>
                            <div id="usageList">
                                <div class="mb-3">
                                    <p class="mb-1"><span class="placeholder col-4"></span></p>
                                    <div class="progress" style="--bs-progress-height: .625rem"><div class="progress-bar bg-secondary" style="width: 0%"></div></div>
                                </div>
                                <div class="mb-3">
                                    <p class="mb-1"><span class="placeholder col-3"></span></p>
                                    <div class="progress" style="--bs-progress-height: .625rem"><div class="progress-bar bg-secondary" style="width: 0%"></div></div>
                                </div>
                                <div class="mb-3">
                                    <p class="mb-1"><span class="placeholder col-5"></span></p>
                                    <div class="progress" style="--bs-progress-height: .625rem"><div class="progress-bar bg-secondary" style="width: 0%"></div></div>
                                </div>
                            </div>
                        </div>

                        <template id="warningBadge">
                            <span class="badge text-bg-warning d-inline-flex align-items-center gap-1">
                                <svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M8 1.6 15 14H1L8 1.6Z" fill="none" stroke="currentColor"
                                          stroke-width="1.7" stroke-linejoin="round"/>
                                    <path d="M8 6.2v3.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                    <circle cx="8" cy="11.9" r="0.9" fill="currentColor"/>
                                </svg>
                                Near limit
                            </span>
                        </template>

                        <template id="criticalBadge">
                            <span class="badge text-bg-danger d-inline-flex align-items-center gap-1">
                                <svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true">
                                    <circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
                                    <path d="M3.6 3.6l8.8 8.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                </svg>
                                Limit reached
                            </span>
                        </template>

                        <span class="invisible text-danger small d-block mb-2" id="form-error" aria-live="polite"></span>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="bg-body-tertiary border-top py-3">
        <div class="container text-center text-body-secondary small">
            <p class="mb-0">Atlas API</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
