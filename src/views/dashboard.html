<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raymond Calderon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <script src="/js/dashboard.js" type="module"></script>
    <title>Phone Co</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="/index.html">Phone Co</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navLinks">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/plans.html">Plans</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <section class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3">Dashboard</h1>
                        <p class="text-body-secondary">Welcome back.</p>

                        <!-- shown briefly after a payment; dashboard.js fills in the receipt id -->
                        <div id="paidBanner" class="alert alert-success d-none" role="alert">
                            Payment received &mdash; receipt #<span id="receiptId"></span>
                        </div>

                        <!-- exactly one of the next two sections is unhidden by dashboard.js,
                             depending on whether /subscriptions/me returns a subscription -->
                        <div id="myPlanSection" class="d-none">
                            <!-- the three figures worth acting on. each is a card; only the
                                 plan tile links anywhere so far, via .stretched-link, which
                                 expands to cover the whole card -->
                            <div class="row row-cols-1 row-cols-sm-3 g-3 mb-3">
                                <div class="col">
                                    <div class="card h-100">
                                        <div class="card-body">
                                            <p class="text-uppercase small fw-semibold text-body-secondary mb-1">Plan</p>
                                            <p class="fs-4 fw-semibold lh-1 mb-1" id="planName"></p>
                                            <p class="small text-body-secondary mb-0" id="planPrice"></p>
                                            <a href="/plans.html" class="stretched-link" aria-label="Change plan"></a>
                                        </div>
                                    </div>
                                </div>

                                <div class="col">
                                    <div class="card h-100">
                                        <div class="card-body">
                                            <p class="text-uppercase small fw-semibold text-body-secondary mb-1">Next bill</p>
                                            <p class="fs-4 fw-semibold lh-1 mb-1" id="nextBillDue"></p>
                                            <p class="small text-body-secondary mb-0" id="nextBillIn"></p>
                                        </div>
                                    </div>
                                </div>

                                <div class="col">
                                    <div class="card h-100">
                                        <div class="card-body">
                                            <p class="text-uppercase small fw-semibold text-body-secondary mb-1">Calls this period</p>
                                            <p class="fs-4 fw-semibold lh-1 mb-1" id="totalCalls"></p>
                                            <p class="small text-body-secondary mb-0" id="apiCount"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <p class="text-body-secondary small mb-0">Member since <span id="planSince"></span></p>
                        </div>

                        <div id="pickPlanPrompt" class="d-none">
                            <h2 class="h5">No plan yet</h2>
                            <p>You don't have a plan. Pick one to get started!</p>
                            <p><a href="/plans.html">Pick a plan</a></p>
                        </div>

                        <!-- unhidden alongside #myPlanSection; dashboard.js builds one
                             row per API the plan grants -->
                        <div id="usageSection" class="d-none">
                            <hr>
                            <h2 class="h5">API Usage This Period</h2>
                            <div id="usageList"></div>
                        </div>

                        <!-- form-level errors (server trouble) -- text is filled in by dashboard.js -->
                        <span class="invisible text-danger small d-block mb-2" id="form-error" aria-live="polite"></span>

                        <button id="logout-button" type="button" class="btn btn-outline-secondary">Log out</button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="bg-body-tertiary border-top py-3">
        <div class="container text-center text-body-secondary small">
            <p class="mb-0">Phone Co &mdash; a learning project, not a real service.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
