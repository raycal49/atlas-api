<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raymond Calderon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <script src="/js/dashboard.js" type="module"></script>
    <title>Phone Co</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">Phone Co</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navLinks">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <section class="card shadow-sm">
                        <div class="card-body">
                            <h1 class="h3">Dashboard</h1>
                            <p class="subtitle text-muted">Welcome back.</p>

                            <!-- shown briefly after a payment; dashboard.js fills in the receipt id -->
                            <div id="paidBanner" class="alert alert-success hidden" role="alert">
                                Payment received &mdash; receipt #<span id="receiptId"></span>
                            </div>

                            <!-- exactly one of the next two sections is unhidden by dashboard.js,
                                 depending on whether /subscriptions/me returns a subscription -->
                            <!-- the three figures worth acting on. dashboard.js fills the
                                 values; only the plan tile links anywhere so far -->
                            <div id="myPlanSection" class="hidden">
                                <div class="kpi-row">
                                    <a class="kpi-tile" href="/plans.html">
                                        <span class="kpi-label">Plan</span>
                                        <span class="kpi-value" id="planName"></span>
                                        <span class="kpi-sub" id="planPrice"></span>
                                        <svg class="kpi-chevron" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
                                            <path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor"
                                                  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </a>

                                    <div class="kpi-tile">
                                        <span class="kpi-label">Next bill</span>
                                        <span class="kpi-value" id="nextBillDue"></span>
                                        <span class="kpi-sub" id="nextBillIn"></span>
                                    </div>

                                    <div class="kpi-tile">
                                        <span class="kpi-label">Calls this period</span>
                                        <span class="kpi-value" id="totalCalls"></span>
                                        <span class="kpi-sub" id="apiCount"></span>
                                    </div>
                                </div>

                                <p class="text-muted small mb-0">Member since <span id="planSince"></span></p>
                            </div>

                            <div id="pickPlanPrompt" class="hidden">
                                <h2 class="h5">No plan yet</h2>
                                <p>You don't have a plan. Pick one to get started!</p>
                                <p><a href="/plans.html">Pick a plan</a></p>
                            </div>

                            <!-- unhidden alongside #myPlanSection; dashboard.js builds one
                                 row per API the plan grants -->
                            <div id="usageSection" class="hidden">
                                <hr>
                                <h2 class="h5">API Usage This Period</h2>
                                <div id="usageList"></div>
                            </div>

                            <!-- form-level errors (server trouble) -- text is filled in by dashboard.js -->
                            <span class="invisible text-danger small d-block mb-2" id="form-error" aria-live="polite"></span>

                            <button id="logout-button" type="button" class="btn btn-outline-secondary">Log out</button>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-muted">
        <p class="mb-0"><a href="about.html">About us</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
