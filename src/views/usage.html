<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raymond Calderon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <script src="/js/usage.js" type="module"></script>
    <title>Phone Co</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="/index.html">Phone Co</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navLinks">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/plans.html">Plans</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Call log</li>
                    </ol>
                </nav>

                <h1 class="h3 mb-1">Call log</h1>
                <p class="text-body-secondary">Every API call on your account, newest first.</p>

                <section class="card shadow-sm">
                    <div class="card-body">

                        <!-- table-responsive keeps a wide table scrolling inside its own
                             box instead of pushing the page sideways on a phone -->
                        <div class="table-responsive d-none" id="logTableWrap">
                            <table class="table table-hover align-middle mb-0">
                                <caption class="visually-hidden">Your API calls, newest first</caption>
                                <thead>
                                    <tr>
                                        <th scope="col">When</th>
                                        <th scope="col">API</th>
                                    </tr>
                                </thead>
                                <tbody id="logBody"></tbody>
                            </table>
                        </div>

                        <p id="noCalls" class="text-body-secondary mb-0 d-none">
                            No calls recorded yet.
                        </p>

                        <div class="d-flex align-items-center gap-3 mt-3">
                            <button id="loadMore" type="button" class="btn btn-outline-secondary d-none">
                                Load more
                            </button>
                            <span class="small text-body-secondary" id="loadedCount" aria-live="polite"></span>
                        </div>

                        <!-- form-level errors (server trouble) -- text is filled in by usage.js -->
                        <span class="invisible text-danger small d-block mt-3" id="form-error" aria-live="polite"></span>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer class="bg-body-tertiary border-top py-3">
        <div class="container text-center text-body-secondary small">
            <p class="mb-0">Phone Co &mdash; a learning project, not a real service.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
