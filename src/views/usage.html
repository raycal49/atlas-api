<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raymond Calderon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <!-- Stamps the auth state on <html> from the signed_in cookie BEFORE the body
         paints, so the navbar is correct on the first frame rather than briefly
         wrong. Must stay a plain blocking script: defer or type="module" would
         both run after the body renders and reintroduce the flash. -->
    <script>
        document.documentElement.classList.add(
            /(^|;\s*)signed_in=1(;|$)/.test(document.cookie) ? "auth-in" : "auth-out"
        );
    </script>
    <script src="/js/usage.js" type="module"></script>
    <title>Phone Co</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="/index.html">Phone Co</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
                        aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navLinks">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/plans.html">Plans</a></li>

                        <li class="nav-item" data-auth="in"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                        <li class="nav-item" data-auth="in">
                            <!-- a plain form POST, so the navbar needs no JavaScript at all -->
                            <form method="POST" action="/auth/logout">
                                <button type="submit" class="nav-link border-0 bg-transparent">Log out</button>
                            </form>
                        </li>

                        <li class="nav-item" data-auth="out"><a class="nav-link" href="/login.html">Login</a></li>
                        <li class="nav-item" data-auth="out"><a class="nav-link" href="/register.html">Register</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Call log</li>
                    </ol>
                </nav>

                <h1 class="h3 mb-1">Call log</h1>
                <p class="text-body-secondary">Every API call on your account, newest first.</p>

                <section class="card shadow-sm">
                    <div class="card-body">

                        <!-- A plain GET form: submitting navigates to /usage?api=&from=&to=,
                             and usage.js reads those values back out of the URL. The form
                             deliberately has no page field, so changing filters always lands
                             on page 1. Clear is just a link back to the unfiltered page. -->
                        <form method="GET" action="/usage" class="row g-2 align-items-end mb-3" id="filters">
                            <div class="col-sm-4">
                                <label for="api" class="form-label small mb-1">API</label>
                                <select class="form-select form-select-sm" id="api" name="api">
                                    <option value="">All APIs</option>
                                    <!-- options filled in by usage.js from /usage/apis -->
                                </select>
                            </div>
                            <div class="col-sm-3">
                                <label for="from" class="form-label small mb-1">From</label>
                                <input type="date" class="form-control form-control-sm" id="from" name="from">
                            </div>
                            <div class="col-sm-3">
                                <label for="to" class="form-label small mb-1">To</label>
                                <input type="date" class="form-control form-control-sm" id="to" name="to">
                            </div>
                            <div class="col-sm-2 d-flex gap-2">
                                <button type="submit" class="btn btn-sm btn-primary">Apply</button>
                                <a href="/usage" class="btn btn-sm btn-outline-secondary">Clear</a>
                            </div>
                        </form>

                        <!-- table-responsive keeps a wide table scrolling inside its own
                             box instead of pushing the page sideways on a phone -->
                        <div class="table-responsive" id="logTableWrap">
                            <table class="table table-sm table-hover align-middle mb-0">
                                <caption class="visually-hidden">Your API calls, newest first</caption>
                                <thead>
                                    <tr>
                                        <th scope="col">When</th>
                                        <th scope="col">API</th>
                                    </tr>
                                </thead>
                                <tbody id="logBody"></tbody>
                            </table>
                        </div>

                        <p id="noCalls" class="text-body-secondary mb-0 d-none">
                            No calls match.
                        </p>

                        <!-- "Page 2 of 14 · 340 calls" -->
                        <div class="d-flex justify-content-center align-items-center gap-3 mt-3">
                            <!-- Bootstrap's pagination component; usage.js fills the list with
                                 plain links, so each page is just a URL and Back works -->
                            <nav aria-label="Call log pages">
                                <ul class="pagination pagination-sm mb-0 d-none" id="pager"></ul>
                            </nav>
                            <span class="small text-body-secondary" id="pageStatus" aria-live="polite"></span>
                        </div>

                        <!-- form-level errors (server trouble) -- text is filled in by usage.js -->
                        <span class="invisible text-danger small d-block mt-3" id="form-error" aria-live="polite"></span>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer class="bg-body-tertiary border-top py-3">
        <div class="container text-center text-body-secondary small">
            <p class="mb-0">Phone Co &mdash; a learning project, not a real service.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
